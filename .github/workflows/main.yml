name: Crear instalador Windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: NZXT-Instalador-Windows
          path: dist-installer/**/*.exe
